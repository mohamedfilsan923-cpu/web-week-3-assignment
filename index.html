<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Page Heading Card -->
        <header class="card header-card">
            <h1>Personal Budget Tracker</h1>
            <p>Keep track of your monthly expenses and stay on top of your financial goals.</p>
        </header>

        <!-- Add Expense Form Card -->
        <section class="card form-card">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Grocery Shopping" required>
                </div>
                
                <div class="form-group">
                    <label for="expense-amount">Amount ($)</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 45.00" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="food">Food & Groceries</option>
                        <option value="transport">Transport</option>
                        <option value="utilities">Utilities</option>
                        <option value="entertainment">Entertainment</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </section>

        <!-- Expense Table Card -->
        <section class="card table-card">
            <h2>Expense History</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Expense Name</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Weekly Groceries</td>
                            <td>Food & Groceries</td>
                            <td>$65.50</td>
                        </tr>
                        <tr>
                            <td>Monthly Bus Pass</td>
                            <td>Transport</td>
                            <td>$30.00</td>
                        </tr>
                        <tr>
                            <td>Electricity Bill</td>
                            <td>Utilities</td>
                            <td>$45.20</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

</body>
</html>
